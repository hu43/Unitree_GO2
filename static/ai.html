<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI 控制界面</title>
<link rel="stylesheet" href="style.css">
<style>
  body { overflow: auto; }
  #ai { max-width: 720px; margin: 0 auto; padding: 16px 12px 40px; display: flex; flex-direction: column; gap: 16px; min-height: 100vh; }
  .ai-header { display: flex; align-items: center; justify-content: space-between; }
  .ai-header h1 { font-size: 20px; }
  .card { background: var(--card); border: 1px solid #2a3550; border-radius: 12px; padding: 14px; }
  .card h2 { font-size: 15px; color: var(--accent); margin-bottom: 10px; }
  .card.disabled { opacity: .55; }
  .dev-tag { font-size: 11px; color: var(--warn); border: 1px solid #6a5a30; background: #2a2518; padding: 2px 8px; border-radius: 8px; }
  .chat-box {
    background: #0b0f18; border: 1px solid #232d42; border-radius: 8px;
    height: 260px; overflow-y: auto; padding: 10px; font-size: 13px; line-height: 1.6;
  }
  .chat-box .user { color: var(--ok); margin: 4px 0; white-space: pre-wrap; }
  .chat-box .ai { color: #cfe3ff; margin: 4px 0; white-space: pre-wrap; }
  .chat-box .sys { color: var(--muted); margin: 4px 0; }
  .input-row { display: flex; gap: 8px; margin-top: 8px; }
  .input-row input {
    flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #33415e;
    background: #121a2c; color: var(--fg); font-size: 14px;
  }
  .btn {
    padding: 10px 14px; border-radius: 8px; border: 1px solid #33415e;
    background: var(--card2); color: var(--fg); cursor: pointer; font-size: 13px; white-space: nowrap;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.danger { background: #3a2020; border-color: #7a3030; color: var(--danger); }
  .btn:disabled { opacity: .4; cursor: default; }
  .status { font-size: 12px; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>
<div id="ai">
  <div class="ai-header">
    <h1>🤖 AI 控制界面</h1>
    <button class="home-btn" onclick="location.href='/'">🏠 返回主面板</button>
  </div>

  <!-- 模块1：基础 AI 对话 -->
  <section class="card">
    <h2>💬 基础 AI 对话 <span class="dev-tag">Ollama · gemma3:4b</span></h2>
    <div style="display:flex; gap:8px;">
      <button class="btn primary" id="btn-ai-start">▶ 开始对话</button>
      <button class="btn danger" id="btn-ai-end" disabled>⏹ 结束对话</button>
    </div>
    <div class="chat-box" id="chat-box">
      <div class="sys">点击「开始对话」启动本地 Ollama 模型（首次会自动拉取 gemma3:4b，需要等待下载）。输入 /bye 或点「结束对话」退出。</div>
    </div>
    <div class="input-row">
      <button class="btn" id="btn-ai-photo" title="拍照分析" disabled>📷</button>
      <button class="btn" id="btn-ai-file" title="导入图片/视频分析" disabled>📁</button>
      <input type="file" id="ai-file-cam" accept="image/*" capture="camera" hidden>
      <input type="file" id="ai-file-pick" accept="image/*,video/*" hidden>
      <input type="text" id="ai-input" placeholder="输入消息…" disabled>
      <button class="btn primary" id="btn-ai-send" disabled>发送</button>
    </div>
    <div class="status" id="ai-status">未启动</div>
  </section>

  <!-- 模块2：展厅专用 AI 对话 -->
  <section class="card disabled">
    <h2>🏛️ 展厅专用 AI 对话 <span class="dev-tag">开发中</span></h2>
    <p class="hint">结合展厅展品知识库的专用对话（介绍问答、导览互动等），后续开发。</p>
  </section>

  <!-- 模块3：智能 AI 控制 -->
  <section class="card disabled">
    <h2>🧠 智能 AI 控制 <span class="dev-tag">开发中</span></h2>
    <p class="hint">语音/自然语言控制机器人运动与导览（LLM + 运动指令联动），后续开发。</p>
  </section>
</div>

<script src="ai.js"></script>
</body>
</html>
