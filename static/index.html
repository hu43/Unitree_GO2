<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Go2 机器狗主面板</title>
<link rel="stylesheet" href="style.css">
<style>
  /* main panel layout */
  body { overflow: auto; }
  #home {
    max-width: 560px; margin: 0 auto; padding: 24px 16px 40px;
    display: flex; flex-direction: column; align-items: center; gap: 20px;
    min-height: 100vh;
  }
  .logo {
    font-size: 72px; line-height: 1; margin-top: 16px;
    filter: drop-shadow(0 8px 24px rgba(74,158,255,.35));
  }
  .home-title { text-align: center; }
  .home-title h1 { font-size: 26px; font-weight: 700; }
  .home-title p { color: var(--muted); font-size: 14px; margin-top: 6px; }
  .status-card {
    width: 100%; background: var(--card); border: 1px solid #2a3550;
    border-radius: 12px; padding: 14px 16px; font-size: 14px; line-height: 1.9;
  }
  .status-card .row { display: flex; justify-content: space-between; }
  .status-card b { color: var(--ok); }
  .status-card .bad { color: var(--danger); }
  .big-btn {
    width: 100%; padding: 20px; border-radius: 14px; border: none;
    background: linear-gradient(135deg, var(--accent), #2f7ad0);
    color: #fff; font-size: 20px; font-weight: 700; cursor: pointer;
    box-shadow: 0 6px 24px rgba(74,158,255,.35);
  }
  .big-btn:active { transform: scale(.98); }
  .sec-title { width: 100%; color: var(--accent); font-size: 15px; font-weight: 600; text-align: left; margin-top: 4px; }
  /* 连接机器人入口 */
  .connect-card {
    width: 100%; display: flex; align-items: center; gap: 14px; cursor: pointer;
    background: linear-gradient(135deg, rgba(74,158,255,.12), rgba(74,158,255,.03));
    border: 1px solid rgba(74,158,255,.3); border-radius: 12px; padding: 14px 16px;
    transition: background .15s;
  }
  .connect-card:active { background: linear-gradient(135deg, rgba(74,158,255,.2), rgba(74,158,255,.06)); }
  .connect-card.online { border-color: rgba(52,211,153,.45);
    background: linear-gradient(135deg, rgba(52,211,153,.1), rgba(52,211,153,.03)); }
  .connect-icon {
    width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0;
    background: rgba(74,158,255,.18); display: flex; align-items: center;
    justify-content: center; font-size: 21px;
  }
  .connect-main { flex: 1; min-width: 0; }
  .connect-main b { display: block; font-size: 15px; margin-bottom: 3px; }
  .connect-main span { font-size: 12px; color: var(--muted); word-break: break-all; }
  .connect-main .dot-ok { color: var(--ok); }
  .connect-main .dot-bad { color: var(--danger); }
  .connect-go { font-size: 13px; color: var(--accent); font-weight: 600; flex-shrink: 0; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
  .grid-2 a, .grid-2 .grid-btn {
    display: block; width: 100%; text-align: center; padding: 14px 8px; border-radius: 10px;
    background: var(--card2); border: 1px solid #33415e; color: var(--fg);
    text-decoration: none; font-size: 14px; font-family: inherit; cursor: pointer;
  }
  .footer { color: var(--muted); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<div id="home">
  <div class="logo">🐕</div>
  <div class="home-title">
    <h1>Go2 机器狗主面板</h1>
    <p>Unitree Go2 · 展厅导览系统</p>
  </div>

  <div class="status-card">
    <div class="row"><span>系统连接</span><b id="hm-conn">检测中…</b></div>
    <div class="row"><span>机器人位置</span><b id="hm-pos">-</b></div>
    <div class="row"><span>朝向</span><b id="hm-yaw">-</b></div>
    <div class="row"><span>地图点</span><b id="hm-map">0</b></div>
  </div>

  <!-- 连接机器人 -->
  <div class="connect-card" id="card-connect">
    <div class="connect-icon">🔗</div>
    <div class="connect-main">
      <b>连接机器人</b>
      <span id="connect-sub">检测中…</span>
    </div>
    <span class="connect-go">去连接 ▶</span>
  </div>

  <button class="big-btn" onclick="go('/console')">🚶 进入展厅导览控制台</button>

  <div class="sec-title">功能入口</div>
  <div class="grid-2">
    <button class="grid-btn" id="btn-restart">🔄 重启 App</button>
    <a href="/slam" data-path="/slam">🧭 SLAM 建图</a>
    <a href="/motion" data-path="/motion">🕹️ 运动模式</a>
    <a href="/ai" data-path="/ai">🤖 AI 控制</a>
  </div>

  <div class="footer">SCAN-Planner · Go2 X · ROS2 Humble</div>
</div>

<script>
// main panel: show robot status via WebSocket (read-only dashboard)
const $ = (id) => document.getElementById(id);
let ws = null;

// ---- 后端地址：连接向导保存的 IP 优先（保存后整块面板指向该地址）----
const SAVED_IP = localStorage.getItem("go2_server_ip") || "";
const BACKEND = (SAVED_IP && SAVED_IP !== location.hostname) ? "http://" + SAVED_IP : "";
function go(path) { location.href = BACKEND + path; }
document.querySelectorAll("a[data-path]").forEach((a) => {
  a.href = BACKEND + a.dataset.path;
});

// ---- 连接机器人入口 ----
$("card-connect").addEventListener("click", () => { location.href = "/connect"; });
(function paintConnect() {
  const sub = $("connect-sub");
  if (!SAVED_IP) {
    sub.textContent = "当前面板地址 " + location.host + "，未保存其他地址";
    return;
  }
  if (SAVED_IP === location.hostname) {
    sub.innerHTML = '<span class="dot-ok">● 已连接</span> ' + SAVED_IP;
    $("card-connect").classList.add("online");
    return;
  }
  sub.textContent = "已保存后端 " + SAVED_IP + "，探测中…";
  fetch("http://" + SAVED_IP + "/api/net/status", { cache: "no-store" })
    .then((r) => r.json())
    .then((d) => {
      if (d && d.ok) {
        sub.innerHTML = '<span class="dot-ok">● 已连接</span> ' + SAVED_IP;
        $("card-connect").classList.add("online");
      } else {
        sub.innerHTML = '<span class="dot-bad">● 不可达</span> ' + SAVED_IP;
      }
    })
    .catch(() => { sub.innerHTML = '<span class="dot-bad">● 不可达</span> ' + SAVED_IP; });
})();
function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen = () => { $("hm-conn").textContent = "● 已连接"; $("hm-conn").className = ""; };
  ws.onclose = () => {
    $("hm-conn").textContent = "● 未连接"; $("hm-conn").className = "bad";
    setTimeout(connect, 2000);
  };
  ws.onerror = () => ws.close();
  ws.onmessage = (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    if (m.type === "state") {
      $("hm-pos").textContent = `${m.pos[0].toFixed(2)}, ${m.pos[1].toFixed(2)}`;
      $("hm-yaw").textContent = `${(m.yaw * 180 / Math.PI).toFixed(1)}°`;
      $("hm-map").textContent = m.map.length;
    }
  };
}

// restart the web app (re-initialises its ROS/DDS connection)
$("btn-restart").addEventListener("click", () => {
  if (!confirm("重启 App？\n\n页面会短暂断开，几秒后自动恢复。")) return;
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: "restart" }));
  }
  $("hm-conn").textContent = "● 正在重启…";
  $("hm-conn").className = "";
});

connect();
</script>
</body>
</html>
