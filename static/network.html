<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>网络设置</title>
<link rel="stylesheet" href="style.css">
<style>
  body { overflow: auto; }
  #net { max-width: 720px; margin: 0 auto; padding: 16px 12px 40px; display: flex; flex-direction: column; gap: 16px; min-height: 100vh; }
  .net-header { display: flex; align-items: center; justify-content: space-between; }
  .net-header h1 { font-size: 20px; }
  .card { background: var(--card); border: 1px solid #2a3550; border-radius: 12px; padding: 14px; }
  .card h2 { font-size: 15px; color: var(--accent); margin-bottom: 10px; }
  .row { display: flex; justify-content: space-between; font-size: 14px; line-height: 1.9; }
  .row b { color: var(--ok); font-weight: 600; }
  .mode-opt {
    display: flex; align-items: flex-start; gap: 10px; padding: 12px;
    border: 1px solid #33415e; border-radius: 10px; margin-bottom: 8px; cursor: pointer;
  }
  .mode-opt.sel { border-color: var(--accent); background: #1b2740; }
  .mode-opt input { margin-top: 3px; }
  .mode-opt span { display: block; font-size: 15px; }
  .mode-opt small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .input-row { display: flex; gap: 8px; margin-top: 8px; }
  .input-row input, .input-row select {
    flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #33415e;
    background: #121a2c; color: var(--fg); font-size: 14px;
  }
  .btn {
    padding: 10px 14px; border-radius: 8px; border: 1px solid #33415e;
    background: var(--card2); color: var(--fg); cursor: pointer; font-size: 13px; white-space: nowrap;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: .4; cursor: default; }
  .warn { color: var(--warn); font-size: 12px; line-height: 1.7; margin-top: 10px; }
  .status { font-size: 12px; color: var(--muted); margin-top: 6px; }
  #wifi-fields { display: none; }
</style>
</head>
<body>
<div id="net">
  <div class="net-header">
    <h1>🌐 网络设置</h1>
    <button class="home-btn" onclick="location.href='/'">🏠 返回主面板</button>
  </div>

  <!-- 当前状态 -->
  <section class="card">
    <h2>📡 当前状态</h2>
    <div class="row"><span>连接方式</span><b id="nw-mode">-</b></div>
    <div class="row"><span>WiFi 名称</span><b id="nw-ssid">-</b></div>
    <div class="row"><span>WiFi 状态</span><b id="nw-wstate">-</b></div>
    <div class="row"><span>机器狗 IP</span><b id="nw-robot-ip">-</b></div>
    <div class="row"><span>本机(Jetson) IP</span><b id="nw-jetson-ip">-</b></div>
  </section>

  <!-- 连接方式 -->
  <section class="card">
    <h2>🔀 连接方式</h2>
    <label class="mode-opt sel" id="opt-ap">
      <input type="radio" name="mode" value="ap" checked>
      <span>🛜 机器狗 AP 直连<small>Jetson 连接机器狗自身热点，无需网线（默认）</small></span>
    </label>
    <label class="mode-opt" id="opt-wifi">
      <input type="radio" name="mode" value="wifi">
      <span>📶 外部 WiFi<small>连接指定 WiFi（需填 SSID 和密码）</small></span>
    </label>

    <div id="wifi-fields">
      <div class="input-row">
        <input type="text" id="nw-ssid-input" placeholder="WiFi 名称 (SSID)">
        <button class="btn" id="btn-scan">🔍 扫描</button>
      </div>
      <div class="input-row">
        <select id="nw-ssid-list" style="display:none"></select>
      </div>
      <div class="input-row">
        <input type="password" id="nw-pass-input" placeholder="WiFi 密码">
      </div>
    </div>

    <div class="input-row" style="margin-top:12px">
      <button class="btn primary" id="btn-apply">✔ 应用并切换</button>
      <button class="btn" id="btn-refresh">↻ 刷新状态</button>
    </div>
    <p class="warn">⚠️ 切换会断开当前网络连接。若热点未开启或密码错误，本机将失去网络，需到现场恢复（未启用自动回退）。</p>
    <div class="status" id="nw-status">就绪</div>
  </section>
</div>

<script src="network.js"></script>
</body>
</html>
