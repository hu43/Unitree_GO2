# hostapd 配置 —— Go2 机载电脑开 WiFi 热点
# 用法: sudo hostapd /home/unitree/hu/go2/web/bt_daemon/hostapd.conf
# 注意: interface 必须与实际 WiFi 网卡名一致（setup_ap.sh 会按参数改写）

interface=wlan0
driver=nl80211

# ---- 热点信息 ----
ssid=Unitree-Go2
# 2.4G 信道 1~11（兼容性好）；若用 5G 改 hw_mode=a, channel=36/149
hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1
ht_capab=[HT40+][SHORT-GI-20][SHORT-GI-40]

# ---- 认证 ----
# WPA2-PSK，密码至少 8 位
auth_algs=1
wpa=2
wpa_passphrase=12345678
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP

# ---- 杂项 ----
beacon_int=100
dtim_period=2
max_num_sta=8

country_code=CN
ieee80211d=1
