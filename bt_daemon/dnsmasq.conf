# dnsmasq 配置 —— 给连上热点的手机发 DHCP + DNS
# 由 setup_ap.sh 生成到 /tmp/dnsmasq_ap.conf 后启动

# 监听 AP 网卡
interface=wlan0
bind-interfaces

# 监听地址（机器人的 AP 网关 IP）
# ⚠️ 用 192.168.124.1 而非 123.1：eth0 是 192.168.123.x，同段会路由冲突
listen-address=192.168.124.1

# DHCP 段：从 .10 发到 .100，租约 12h
dhcp-range=192.168.124.10,192.168.124.100,12h
dhcp-option=option:router,192.168.124.1
dhcp-option=option:dns-server,192.168.124.1,8.8.8.8

# 不读系统 /etc/resolv.conf（避免污染）
no-resolv
domain=unitree.local

# 日志
log-dhcp
dhcp-leasefile=/tmp/dnsmasq_ap.leases
pid-file=/tmp/dnsmasq_ap.pid
